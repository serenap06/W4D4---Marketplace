    <link rel="stylesheet" href="./details.css">

<body>
    <header class="overflow-hidden mx-3 mx-md-5">
        <div class="bg-warning text-white text-center">
            <span class="fw-light py-1 fst-italic">* 20% off on your first order *</span>
        </div>
        <nav class="navbar navbar-expand-lg border-bottom my-2">
            <div class="container">
                <a class="navbar-brand text-warning fs-4" aria-current="page" href="index.html">MARKETPLACE</a>
                <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">

                        <span class="my-1 ps-1" id="product-price"></span>
                        <p class="my-1 ps-1 lh-sm" id="product-description"></p>
                        <button class="btn align-end btn-warning rounded-0 text-white w-100 my-3 ms-1" type="button">
                            BUY NOW
                        </button>
                    </div>
    
                </div>
            </div>
        </section>

    <footer class="footer text-center">
