<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <header class="overflow-hidden mx-5">
        <div class="bg-warning text-white text-center">
            <span class="fw-light py-1 fst-italic">* 20% off on your first order *</span>
        </div>
        <nav class="navbar navbar-expand-lg border-bottom my-2">
            <div class="container">
                <a class="navbar-brand text-warning fs-4">MARKETPLACE</a>
                <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="fw-medium nav-link text-black" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="backoffice.html">Backoffice</a>
                        </li>
                    </ul>
                    <form class="d-flex my-2" role="search">
                        <input id="input-search" class="form-control me-2 fw-light" type="search" placeholder="Search"
                            aria-label="Search" />
                        <button id="btn-search" class="btn btn-outline-warning" type="submit">Search</button>
                    </form>
                </div>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </nav>
    </header>
    <section class="mx-5">
        <div class="container">
            <div class="row py-5 d-flex align-items-center">
                <div class="col-3">
                    <p class="fw-lighter fs-6">Explore our curated range of <br>products to elevate every part <br>of
                        your
                        life</p>
                </div>
                <div class="col-9">
                    <h1 class="text-warning fw-normal">ALL YOUR FAVORITES <br>IN ONE PLACE</h1>
                </div>
            </div>
        </div>
    </section>
    <section class="mx-5">
        <div class="container">
            <div class="row mb-1">
                <div class="col-3 d-none d-md-block">
                    <span>FILTERS</span>
                    <span><i class="bi bi-filter"></i></span>
                </div>
                <div class="col-9">
                    <span>SORT BY</span>
                    <span><i class="bi bi-chevron-down"></i></span>
                </div>
            </div>
            <div class="row border-top">
                <div class="col-md-3 border-end d-none d-md-block">
                    <div id="container-filters" class="row"></div>
                </div>
                <div class="col-12 col-md-9">
                    <div id="container-cards" class="row"></div>
                </div>
            </div>
        </div>
    </section>




    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    <script src="./index.js"></script>
</body>

</html>
